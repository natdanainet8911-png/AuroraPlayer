name: Build Aurora Player

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Assemble release APK
        env:
          KEYSTORE_PATH:     ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer-apk
          path: composeApp/build/outputs/apk/release/*.apk

  windows:
    name: Build EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset (required by jpackage)
        run: choco install wixtoolset --no-progress -y

      - name: Package EXE + MSI
        run: ./gradlew packageReleaseExe packageReleaseMsi --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer-windows
          path: composeApp/build/compose/binaries/main-release/**/*.{exe,msi}

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AuroraPlayer-apk/*.apk
            AuroraPlayer-windows/**/*
